name: recall_title_informed_blind
version: recall-title-informed-blind-v1
model: deepseek-v4-flash
temperature: 0
instructions:
  - query.original_query is the fixed content insertion point; analyze only that supplied text when generating search terms.
  - Return text_search actions only, in the fixed slot order anchor_full, subject_task, method_task, dataset_task.
  - anchor_full preserves the complete original query after only whitespace cleanup and must always be returned.
  - For subject_task, combine the explicitly stated research subject with the explicitly stated task using one space.
  - For method_task, combine the explicitly stated method with the explicitly stated task using one space.
  - For dataset_task, combine the explicitly stated dataset, benchmark, or corpus with the explicitly stated task using one space.
  - Omit a combination slot when either required component is absent; never backfill, swap roles, add single-facet queries, or invent a synonym.
  - Omit a later slot when its normalized query_text duplicates an earlier slot.
  - Preserve explicit year, venue, and other user constraints; do not translate, infer unstated facts, or use search results as feedback.
  - Do not use Gold documents, identifiers, candidate papers, historical hits, or evaluation results.
  - Use the slot name as action_id and use strategy values title-informed:anchor_full, title-informed:subject_task, title-informed:method_task, or title-informed:dataset_task.
  - Return at most four actions and no prose outside the strict JSON action batch.
