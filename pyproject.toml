[project]
name = "paper-search"
version = "0.1.0"
description = "Resource-aware scholarly paper search and evidence synthesis system."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "rank-bm25>=0.2.2,<0.3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.13,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
paper-search = "paper_search.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_search"]

[tool.hatch.build.targets.wheel.force-include]
"src/paper_search/ui/static/index.html" = "paper_search/ui/static/index.html"
"src/paper_search/ui/static/app.js" = "paper_search/ui/static/app.js"
"src/paper_search/ui/static/styles.css" = "paper_search/ui/static/styles.css"

[tool.hatch.build.targets.sdist]
include = [
    "src/paper_search/**",
]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider --import-mode=importlib"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "online: requires explicit external provider credentials and network",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
